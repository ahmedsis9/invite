<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلعة صغيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#6f4a9f;--bg2:#47216e;--glass:rgba(255,255,255,.16);--glass2:rgba(255,255,255,.28);--text:#fff;--soft:rgba(255,255,255,.75);--gold:#f5c451;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#523578;--bg2:#2a1347}}
:root[data-theme="dark"]{--bg1:#523578;--bg2:#2a1347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 25%,var(--bg1),var(--bg2));color:var(--text);font-family:Cairo,Tahoma,sans-serif;overflow:hidden}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative}
.dots{position:absolute;top:28px;display:flex;gap:8px}
.dots i{width:36px;height:4px;border-radius:4px;background:var(--glass2);transition:background .3s}
.dots i.on{background:var(--gold)}
.screen{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px}
.screen.on{display:flex}
.small{font-size:1.05rem;color:var(--soft);margin:0}
h1{font-size:2.3rem;font-weight:900;margin:0;line-height:1.3}
h2{font-size:1.7rem;font-weight:700;margin:0;line-height:1.4}
.row{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:26px;min-height:110px}
button{font:inherit;color:var(--text);cursor:pointer;border:0;transition:transform .25s}
.yes{background:#fff;color:#4a2672;font-weight:700;font-size:1.15rem;padding:14px 34px;border-radius:40px;box-shadow:0 0 28px rgba(255,220,160,.55)}
.no{background:var(--glass);border:1px solid var(--glass2);font-size:1rem;padding:12px 24px;border-radius:40px}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:14px}
.opt{background:var(--glass);border:1px solid var(--glass2);border-radius:16px;padding:16px;font-size:1.15rem;font-weight:700}
.opt:hover,.opt:focus-visible{background:var(--glass2);transform:scale(1.03);outline:2px solid var(--gold)}
.sum{background:var(--glass);border-radius:18px;padding:14px 20px;font-size:1.2rem;font-weight:700}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="dots" id="dots"><i class="on"></i><i></i></div>

  <section class="screen on" id="s0">
    <h1>تريد نطلع؟</h1>
    <div class="row">
      <button class="yes" id="yes">نعم</button>
      <button class="no" id="no">لا</button>
    </div>
  </section>

  <section class="screen" id="s1">
    <h2>بأي وقت يعجبك</h2>
    <p class="small">أني ماعندي شي</p>
    <div class="opts" id="times"></div>
  </section>

  <section class="screen" id="s2">
    <h1>اتفقنا! 🎉</h1>
    <div class="sum" id="sum"></div>
  </section>
</div>
<canvas id="c"></canvas>

<script>
var TIMES = ["4 العصر","5 العصر","6 المغرب","8 بليل"];
var pick = {time:""};

function $(id){return document.getElementById(id)}
function go(n){
  for(var i=0;i<3;i++) $("s"+i).classList.toggle("on", i===n);
  var d = $("dots").children;
  for(var j=0;j<2;j++) d[j].classList.toggle("on", j<=Math.min(n,1));
  if(n===2) finish();
}
TIMES.forEach(function(t){
  var b = document.createElement("button");
  b.className = "opt"; b.textContent = t;
  b.onclick = function(){ pick.time = t; confetti(); go(2); };
  $("times").appendChild(b);
});
$("yes").onclick = function(){ go(1); };

var no = $("no");
function dodge(e){
  e.preventDefault();
  var w = no.offsetWidth, h = no.offsetHeight;
  no.style.position = "fixed";
  no.style.transform = "none";
  no.style.left = (10 + Math.random()*(innerWidth - w - 20)) + "px";
  no.style.top = (50 + Math.random()*(innerHeight - h - 100)) + "px";
}
["pointerenter","pointerdown","touchstart","click"].forEach(function(ev){
  no.addEventListener(ev, dodge, {passive:false});
});

function finish(){
  $("sum").textContent = pick.time;
}

function confetti(){
  var c = $("c"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  var cols = ["#f5c451","#ff8fb1","#8fd3ff","#ffffff","#b99cff"];
  var p = [];
  for(var i=0;i<130;i++) p.push({x:Math.random()*c.width,y:-Math.random()*c.height*.6,r:4+Math.random()*5,vy:2+Math.random()*3,vx:(Math.random()-.5)*2,c:cols[i%5]});
  var t = 0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*1.6)});
    if(++t<220) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>
